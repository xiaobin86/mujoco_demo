version: "2.0"

description: >
  Tuned reward configuration for PandaPickEnv. Success bonus dominates the
  episode return, dense shaping is reduced, and the success hold requirement is
  shortened so the agent can more reliably learn to complete pick-and-place.

rewards:
  time_penalty: -0.05

  approach:
    scale: 0.5
    distance: 0.1

  grasp:
    bonus: 1.0
    distance: 0.05

  lift:
    scale: 1.0
    height: 0.1
    reference_height: 0.015
    min_lifted_height: 0.08

  transport:
    scale: 0.5
    distance: 0.1
    ee_max_distance: 0.2

  success:
    bonus: 5000.0
    threshold: 0.05
    hold_steps: 20
    min_height: 0.08
    require_lifted: true

  drop:
    penalty: -100.0
    height: -0.05

  action:
    penalty: -0.0001

  push:
    penalty: -10.0
    distance: 0.06
    min_displacement: 0.001

  open_gripper:
    penalty: -0.5
    distance: 0.04

logging:
  log_reward_components: true
  log_success_rate: true
  success_rate_window: 100
