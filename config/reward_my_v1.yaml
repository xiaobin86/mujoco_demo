version: "1.0"

description: >
  A more aggressive reward configuration that makes the success bonus dominate the
  episode return. Use this if the policy learns to hover near the cube instead of
  completing the pick-and-place task.

rewards:
  time_penalty: -0.1

  approach:
    scale: 0.5
    distance: 0.1

  grasp:
    bonus: 1.0
    distance: 0.05

  lift:
    scale: 1.0
    height: 0.1
    reference_height: 0.025

  transport:
    scale: 0.5
    distance: 0.1

  success:
    bonus: 5000.0
    threshold: 0.05
    hold_steps: 50
    min_height: 0.03

  drop:
    penalty: -100.0
    height: -0.05

  action:
    penalty: -0.0001

logging:
  log_reward_components: true
  log_success_rate: true
  success_rate_window: 100
